model:
  default: gpt-6-luna
  provider: openai-codex
fallback_providers: []
auxiliary:
  title_generation:
    enabled: false
agent:
  reasoning_effort: medium
  max_turns: 4
  disabled_toolsets:
    - browser-use
    - browser
    - clarify
    - code_execution
    - connections
    - delegation
    - file
    - image_gen
    - cronjob
    - computer_use
    - memory
    - session_search
    - terminal
    - todo
    - tts
    - vision
    - web
memory:
  memory_enabled: false
local_runtime:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
    send: false
