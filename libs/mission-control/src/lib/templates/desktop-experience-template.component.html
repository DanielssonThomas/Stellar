<div
  class="experience bg-stellar-canvas text-stellar-foreground"
  aria-label="Stellar experience"
>
  <stellar-stage-organism
    #stage
    class="stage"
    [loading]="loading()"
    [emblemTarget]="state().target"
    [reducedMotion]="state().reducedMotion"
    (interaction)="action.emit($event)"
  >
    <stellar-emblem-motion-molecule
      stage-emblem
      [manifest]="manifest()"
      assetBasePath="emblem"
      [phase]="state().phase"
      [audioLevel]="level()"
      [reducedMotion]="state().reducedMotion"
      [loading]="loading()"
      [error]="assetError()"
    >
    </stellar-emblem-motion-molecule>
  </stellar-stage-organism>

  <section [class]="controlsClass()" aria-label="Experience controls">
    <p class="status" aria-live="polite" aria-atomic="true">
      {{ statusText() }}
    </p>
    <div class="actions">
      <button
        type="button"
        (click)="
          action.emit({
            type: state().manualActive ? 'manual-end' : 'manual-start',
          })
        "
      >
        {{ state().manualActive ? 'End activity' : 'Start activity' }}
      </button>

      @if (
        state().microphone.status === 'requesting' ||
        state().microphone.status === 'capturing'
      ) {
        <button type="button" (click)="stopMicrophone.emit()">
          Stop microphone
        </button>
      } @else {
        <button
          type="button"
          (click)="action.emit({ type: 'capture-request' })"
        >
          Enable microphone
        </button>
      }

      @if (state().phase !== 'idle') {
        <button type="button" (click)="action.emit({ type: 'dismiss' })">
          Dismiss
        </button>
      }

      @if (state().surface !== null) {
        <button type="button" (click)="restoreSummary.emit()">
          Show activity
        </button>
      }
    </div>
    <label class="motion-toggle">
      <input
        type="checkbox"
        [checked]="state().reducedMotion"
        (change)="setReduced($event)"
      />
      <span>Reduce motion</span>
    </label>
  </section>
</div>
