<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Back-to-back golden and violet profiles within a jeweled botanical emblem</title>
  <defs>
    <linearGradient id="ringGold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8d6429"/><stop offset=".48" stop-color="#f5d98a"/><stop offset="1" stop-color="#a87932"/>
    </linearGradient>
    <linearGradient id="violetFace" x1=".12" y1=".1" x2=".9" y2="1">
      <stop stop-color="#61477f"/><stop offset=".55" stop-color="#39294f"/><stop offset="1" stop-color="#211b35"/>
    </linearGradient>
    <linearGradient id="violetHair" x1="0" y1=".1" x2=".85" y2="1">
      <stop stop-color="#754d91"/><stop offset=".48" stop-color="#382746"/><stop offset="1" stop-color="#211b32"/>
    </linearGradient>
    <linearGradient id="goldFace" x1=".1" y1=".05" x2=".85" y2="1">
      <stop stop-color="#ffe9ad"/><stop offset=".48" stop-color="#d5a954"/><stop offset="1" stop-color="#98682c"/>
    </linearGradient>
    <linearGradient id="goldHair" x1=".1" y1="0" x2=".9" y2="1">
      <stop stop-color="#f3d27c"/><stop offset=".5" stop-color="#bc8739"/><stop offset="1" stop-color="#704922"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ead2ff"/><stop offset=".42" stop-color="#865bab"/><stop offset="1" stop-color="#39264f"/>
    </linearGradient>
  </defs>

