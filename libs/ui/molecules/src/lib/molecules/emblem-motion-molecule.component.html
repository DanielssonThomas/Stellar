@if (loading()) {
  <div
    class="flex h-full w-full items-center justify-center"
    role="status"
    aria-label="Loading emblem"
  >
    <stellar-skeleton-atom shape="control" />
  </div>
} @else if (unavailable()) {
  <span
    class="flex h-full items-center justify-center text-stellar-foreground"
    role="status"
    >Emblem unavailable</span
  >
} @else {
  @if (showWaiting()) {
    <span class="sr-only" role="status">Waiting for assistant response</span>
  }
  <div
    [class]="classes()"
    [style.aspect-ratio]="aspectRatio()"
    [style.--emblem-audio]="level()"
    role="img"
    [attr.aria-label]="label()"
  >
    @if (showWaiting()) {
      <svg class="waiting-ring" viewBox="0 0 512 512" aria-hidden="true">
        <circle cx="256" cy="256" r="238" />
        <circle class="ring-accent" cx="256" cy="256" r="230" />
        <path
          d="M256 2 L260 14 L272 18 L260 22 L256 34 L252 22 L240 18 L252 14 Z"
        />
        <path
          d="M494 240 L498 252 L510 256 L498 260 L494 272 L490 260 L478 256 L490 252 Z"
        />
        <path
          d="M256 478 L260 490 L272 494 L260 498 L256 510 L252 498 L240 494 L252 490 Z"
        />
        <path
          d="M18 240 L22 252 L34 256 L22 260 L18 272 L14 260 L2 256 L14 252 Z"
        />
      </svg>
    }
    @if (environment()) {
      <div class="ambience" aria-hidden="true"></div>
    }
    <div class="emblem-presence">
      <div #camera class="camera">
        @for (layer of layers(); track layer.id) {
          <div
            #plane
            class="plane"
            [style.z-index]="layer.z"
            [style.transform-origin]="layer.origin"
            aria-hidden="true"
          >
            <div
              #artwork
              class="artwork"
              [class.spin-clockwise]="layer.spin === 'clockwise'"
              [class.spin-counter]="layer.spin === 'counter-clockwise'"
              [style.transform-origin]="layer.origin"
            >
              <img
                [src]="layer.src"
                [style.clip-path]="layer.clipPath"
                alt=""
                draggable="false"
                (error)="assetFailed()"
              />
            </div>
          </div>
        }
      </div>
      @if (showSol()) {
        <svg
          class="sol-accents"
          viewBox="0 0 1280 1280"
          aria-hidden="true"
          animate.enter="sol-enter"
          animate.leave="sol-leave"
        >
          <circle class="sol-ring" cx="640" cy="640" r="510" />
          <path
            class="sol-eye"
            d="M352 531 380 523 358 534Z M949 515 971 524 953 523Z"
          />
        </svg>
      }
    </div>
  </div>
}
