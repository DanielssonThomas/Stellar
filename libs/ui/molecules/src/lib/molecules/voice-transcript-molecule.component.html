<section
  class="w-80 max-w-full rounded-xl border border-stellar-line bg-stellar-panel/95 px-4 py-3 text-stellar-foreground shadow-lg"
  aria-label="Voice input"
>
  <h2 class="m-0 text-xs font-medium text-stellar-muted">Recognized speech</h2>
  @if (loading()) {
    <stellar-skeleton-atom shape="text" />
  } @else {
    <p
      class="mt-1 mb-0 max-h-24 overflow-y-auto text-sm leading-relaxed whitespace-pre-wrap wrap-anywhere"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      [textContent]="text()"
    ></p>
  }
</section>
