<section
  class="transcript-showcase relative w-80 max-w-full px-4 py-3"
  aria-label="Voice input"
>
  <h2
    class="transcript-label m-0 text-[0.6rem] font-medium tracking-[0.18em] uppercase"
  >
    <span aria-hidden="true">✧</span> Recognized speech
  </h2>
  @if (status()) {
    <span class="mt-1 block text-[0.6rem] opacity-70">{{ status() }}</span>
  }
  @if (loading()) {
    <stellar-skeleton-atom shape="text" />
  } @else {
    <p
      class="mt-1 mb-0 max-h-24 overflow-y-auto text-sm leading-relaxed whitespace-pre-wrap wrap-anywhere"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      @for (words of [text()]; track words) {
        <span
          class="transcript-text"
          animate.enter="transcript-reveal"
          [textContent]="words"
        ></span>
      }
    </p>
  }
</section>
