@if (loading()) {
  <stellar-skeleton-atom shape="text" />
} @else if (payload(); as message) {
  <article class="stellar-markdown presentation">
    @if (message.title) {
      <h2
        class="text-lg font-semibold [overflow-wrap:anywhere]"
        [textContent]="message.title"
      ></h2>
    }
    <div
      class="markdown"
      [innerHTML]="message.body | presentationMarkdown"
    ></div>
  </article>
}
