@if (loading()) {
  <div
    class="flex h-full items-center justify-center"
    role="status"
    aria-label="Loading Stage"
  >
    <stellar-skeleton-atom shape="control" />
  </div>
} @else {
  <div
    class="emblem-slot"
    [style.--emblem-duration]="motionDuration()"
    [style.left.px]="layout().emblem.x"
    [style.top.px]="layout().emblem.y"
    [style.width.px]="layout().emblem.width"
    [style.height.px]="layout().emblem.height"
  >
    <ng-content select="[stage-emblem]" />
  </div>
  <div
    class="composer-slot"
    [style.display]="layout().composer ? null : 'none'"
    [style.left.px]="layout().composer?.x"
    [style.top.px]="layout().composer?.y"
    [style.width.px]="layout().composer?.width"
    [style.height.px]="layout().composer?.height"
  >
    <ng-content select="[stage-composer]" />
  </div>
  @for (surface of surfaces(); track surface.instanceId) {
    <section
      #panel
      [class]="surface.classes"
      [class.composition-concealed]="composing()"
      [attr.inert]="composing() ? '' : null"
      [attr.aria-hidden]="composing() ? 'true' : null"
      [attr.data-instance-id]="surface.instanceId"
      [attr.aria-label]="surface.title"
      role="region"
      tabindex="-1"
      [style.left.px]="surface.x"
      [style.top.px]="surface.y"
      [style.width.px]="surface.width"
      [style.height.px]="surface.height"
      [style.--emblem-clearance.px]="layout().emblem.height + 48"
      animate.enter="pane-enter"
      (animate.leave)="retire($event)"
    >
      <div
        class="surface-content"
        tabindex="0"
        role="group"
        [attr.aria-label]="surface.title + ' content'"
      >
        <ng-container
          *ngComponentOutlet="surface.component; inputs: surface.inputs"
        />
      </div>
    </section>
  }
}
