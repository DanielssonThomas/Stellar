name: CI

on:
  pull_request:
  push:
    branches: [main, develop, 'release/**']

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select affected base
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$PR_BASE" ]]; then
            echo "NX_BASE=$PR_BASE" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=$PUSH_BASE" >> "$GITHUB_ENV"
          fi
          echo "NX_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"
      - name: Validate issue-linked commit messages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/policy/validate-commit-range.mjs
      - name: Format check
        shell: bash
        run: |
          if [[ "$NX_BASE" =~ ^0+$ ]]; then
            pnpm exec nx format:check
          else
            pnpm exec nx format:check --base="$NX_BASE" --head="$NX_HEAD"
          fi
      - name: Check affected projects with E2E targets
        id: e2e
        shell: bash
        run: |
          if [[ "$NX_BASE" =~ ^0+$ ]]; then
            run_e2e=true
          else
            projects="$(pnpm exec nx show projects --affected --with-target=e2e --base="$NX_BASE" --head="$NX_HEAD" --json)"
            run_e2e="$(printf '%s' "$projects" | node tools/native/ci.mjs e2e)"
          fi
          echo "run=$run_e2e" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: cache-playwright
        if: steps.e2e.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright system dependencies
        if: steps.e2e.outputs.run == 'true' && steps.cache-playwright.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Install Playwright Chromium
        if: steps.e2e.outputs.run == 'true' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Affected quality checks
        shell: bash
        run: |
          if [[ "$NX_BASE" =~ ^0+$ ]]; then
            pnpm exec nx run-many -t lint test build e2e --all --parallel=2
          else
            pnpm exec nx affected -t lint test build e2e --base="$NX_BASE" --head="$NX_HEAD" --parallel=2
          fi
      - run: pnpm run policy:test
      - run: node --test tools/live/*.spec.mjs
      - run: node --test tools/native/*.spec.mjs
      - run: pnpm run policy:docs

  native:
    runs-on: windows-latest
    env:
      NX_DAEMON: 'false'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Python for inert Ivy bridge tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-stellar-native-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Native format, lint, tests, contracts, size and WebView smoke
        run: pnpm exec nx run-many -t native-fmt native-clippy native-test contract-check rust-size-check native-smoke --projects=stellar-desktop --parallel=1

  verify:
    if: always()
    needs: [quality, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require both quality and Windows native success
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: node tools/native/ci.mjs gate
