name: CI

on:
  pull_request:
  push:
    branches: [main, develop, 'release/**']

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select affected base
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$PR_BASE" ]]; then
            echo "NX_BASE=$PR_BASE" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=$PUSH_BASE" >> "$GITHUB_ENV"
          fi
          echo "NX_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"
      - name: Validate issue-linked commit messages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/policy/validate-commit-range.mjs
      - name: Format check
        shell: bash
        run: |
          if [[ "$NX_BASE" =~ ^0+$ ]]; then
            pnpm exec nx format:check
          else
            pnpm exec nx format:check --base="$NX_BASE" --head="$NX_HEAD"
          fi
      - name: Check whether the E2E project is affected
        id: e2e
        shell: bash
        run: |
          if [[ "$NX_BASE" =~ ^0+$ ]]; then
            run_e2e=true
          else
            projects="$(pnpm exec nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" --json)"
            if echo "$projects" | jq -e 'index("stellar-web-e2e") != null' >/dev/null; then
              run_e2e=true
            else
              run_e2e=false
            fi
          fi
          echo "run=$run_e2e" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: cache-playwright
        if: steps.e2e.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright system dependencies
        if: steps.e2e.outputs.run == 'true' && steps.cache-playwright.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Install Playwright Chromium
        if: steps.e2e.outputs.run == 'true' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Affected quality checks
        shell: bash
        run: |
          if [[ "$NX_BASE" =~ ^0+$ ]]; then
            pnpm exec nx run-many -t lint test build e2e --all --parallel=2
          else
            pnpm exec nx affected -t lint test build e2e --base="$NX_BASE" --head="$NX_HEAD" --parallel=2
          fi
      - run: pnpm run policy:test
      - run: node --test tools/live/*.spec.mjs
      - run: pnpm run policy:docs
