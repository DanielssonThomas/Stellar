[package]
name = "stellar-desktop"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "stellar-desktop"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = "=12.0.1"
reqwest = { version = "=0.13.5", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
wasapi = "=0.26.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = []
contract-variant-fixture = []
