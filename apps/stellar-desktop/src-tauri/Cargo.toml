[package]
name = "stellar-desktop"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "stellar-desktop"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = "=12.0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = []
