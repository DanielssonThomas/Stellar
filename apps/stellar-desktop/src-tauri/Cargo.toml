[package]
name = "stellar-desktop"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "stellar-desktop"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = "=12.0.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.54.1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
base64 = "=0.23.1"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
webview2-com = "=0.39.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = []
contract-variant-fixture = []
