<main class="h-dvh bg-stellar-canvas text-stellar-foreground">
  <h1 class="sr-only">{{ title }}</h1>
  <stellar-desktop-experience-template
    [spatialFocus]="spatial.scene() ? spatial.state().featured.length : null"
    (spatialBriefing)="spatial.startSample()"
    [state]="experience.state()"
    [manifest]="experience.manifest()"
    [loading]="experience.loading()"
    [assetError]="experience.assetError()"
    (assetUnavailable)="experience.assetError.set('unavailable')"
    [level]="experience.audio.state().activity.level"
    [musicLevels]="music.levels()"
    [musicTone]="music.tone()"
    [musicSensitivity]="music.sensitivity()"
    [musicStatus]="music.status()"
    [musicEnabled]="music.enabled()"
    (toggleMusic)="music.setEnabled($event)"
    (musicSensitivityChange)="music.setSensitivity($event.band, $event.value)"
    [statusText]="experience.statusText()"
    [inputs]="experience.inputs.items()"
    [inputsVisible]="experience.inputs.visible()"
    [inputsLoading]="experience.inputs.loading()"
    [inputError]="experience.inputs.error()"
    [selectedInputId]="experience.inputs.selectedId()"
    [selectedInputLabel]="experience.inputs.selectedLabel()"
    [activityStatus]="experience.activityStatus()"
    [ivyActivity]="assistant.activity()"
    [sessionSnapshot]="inspector.snapshot()"
    [sessionRows]="inspector.sessions()"
    [sessionMessages]="inspector.messages()"
    [sessionLoading]="inspector.loading()"
    [sessionError]="inspector.error()"
    [verifiedModel]="assistant.state().verified_model ?? 'Unverified'"
    (sessionVisibilityChange)="inspectorVisible($event)"
    (sessionSelected)="inspector.select($event)"
    (sessionRefresh)="inspector.refresh()"
    (sessionMore)="inspector.moreSessions()"
    (sessionOlderMessages)="inspector.olderMessages()"
    (sessionNew)="newInspectorSession()"
    [awarenessEnabled]="awareness.enabled()"
    [awarenessStatus]="awareness.status()"
    (toggleAwareness)="awareness.setEnabled($event)"
    [questions]="
      assistant.state().connection === 'ready' &&
      assistant.state().turn === 'admitted' &&
      !['suspended', 'shutdown'].includes(experience.state().phase)
        ? (assistant.state().questions ?? [])
        : []
    "
    (questionShown)="questionShown($event)"
    (questionAnswer)="answerQuestion($event.id, $event.action)"
    [ivyTurnId]="assistant.state().turn_id"
    [ivyPreparing]="assistant.state().turn === 'submitting'"
    [ivyWorking]="assistant.waiting()"
    [passiveListening]="voice.state().passive ?? false"
    [assistantStatus]="assistant.status()"
    [faultActive]="faults.active()"
    [faultVisible]="faults.visible()"
    [faultEntries]="faults.entries()"
    [faultRecovering]="faultRecovering() || assistant.recovery() === 'checking'"
    (recoverFault)="recoverFault()"
    (dismissFaults)="faults.dismiss()"
    (showFaults)="faults.show()"
    [assistantReply]="reflex.reply() || assistant.reply()"
    [assistantBusy]="assistant.busy() || assistant.uncertain() || reflex.busy()"
    [assistantUncertain]="assistant.uncertain()"
    [assistantWaiting]="assistant.waiting() || voice.waiting() || reflex.busy()"
    [assistantNarrating]="voice.narrating()"
    [solActive]="voice.composition().model === 'sol'"
    [promptRaw]="voice.composition().raw"
    [promptDraft]="voice.composition().draft ?? null"
    [promptPreview]="voice.composition().preview ?? ''"
    [promptRefinementRevision]="voice.composition().refinementRevision ?? 0"
    [promptRefined]="voice.composition().refined"
    [promptStatus]="voice.composition().status"
    [conversationActive]="voice.state().foregroundActive ?? false"
    [voiceStatus]="reflex.busy() ? 'Handling locally' : voice.state().status"
    [voiceInputText]="voice.state().inputText ?? ''"
    [wakeSensitivity]="voice.wakeSensitivity()"
    [showRecognition]="voice.showRecognition()"
    (wakeSensitivityChange)="voice.setWakeSensitivity($event)"
    (showRecognitionChange)="voice.setShowRecognition($event)"
    [recognitionVisible]="voice.showRecognition()"
    [recognitionText]="voice.recognition()?.text ?? ''"
    [recognitionStatus]="voice.recognition()?.status ?? ''"
    [voiceNotice]="voice.state().notice ?? ''"
    [voiceMuted]="voice.state().muted"
    [reflexEnabled]="reflex.enabled()"
    [reflexStatus]="reflex.status()"
    [requestTimeline]="reflex.requests()"
    [cloudStatus]="assistant.state().connection"
    [cloudLabel]="voice.composition().model === 'sol' ? 'Sol' : 'Terra'"
    [reflexLastRoute]="reflex.lastRoute()"
    (toggleReflex)="reflex.setEnabled($event)"
    (copyReflexDiagnostics)="reflex.copyDiagnostics()"
    [reflexDiagnosticNotice]="reflex.diagnosticNotice()"
    [voiceBusy]="voice.state().busy"
    [voiceError]="voice.state().error"
    (muteVoice)="voice.setMuted($event)"
    (stopVoice)="voice.stop()"
    (retryVoice)="voice.retry()"
    (submitText)="voice.submitText($event)"
    (retryIvy)="assistant.retry()"
    (cancelIvy)="reflex.busy() ? reflex.cancel() : assistant.cancel()"
    (reconcileIvy)="assistant.reconcile()"
    (chooseInputs)="experience.inputs.list()"
    (selectInput)="experience.selectInput($event)"
    (action)="experience.dispatch($event)"
    (stopMicrophone)="experience.session.stopMicrophone()"
    (restoreSummary)="experience.session.showSummary()"
  >
    <stellar-spatial-presentation-organism
      desktop-spatial
      [scene]="spatial.scene()"
      [state]="spatial.state()"
      [mode]="spatial.narration().mode"
      [caption]="spatial.narration().caption"
      [transcript]="spatial.transcript()"
      [reducedMotion]="experience.state().reducedMotion"
      (action)="spatial.manual($event)"
      (stop)="spatial.interrupt()"
      (next)="spatial.next()"
      (toggleReadAlong)="spatial.toggleReadAlong()"
      (follow)="spatial.follow()"
    />
  </stellar-desktop-experience-template>
</main>
