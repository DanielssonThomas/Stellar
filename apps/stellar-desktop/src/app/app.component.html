<main class="h-dvh bg-stellar-canvas text-stellar-foreground">
  <h1 class="sr-only">{{ title }}</h1>
  <stellar-desktop-experience-template
    [state]="experience.state()"
    [manifest]="experience.manifest()"
    [loading]="experience.loading()"
    [assetError]="experience.assetError()"
    [level]="experience.audio.state().activity.level"
    [statusText]="experience.statusText()"
    (action)="experience.dispatch($event)"
    (stopMicrophone)="experience.session.stopMicrophone()"
    (restoreSummary)="experience.session.showSummary()"
  />
</main>
