<main
  class="flex min-h-screen flex-col items-center justify-center gap-stellar-4 bg-stellar-canvas p-stellar-4 text-stellar-foreground"
>
  <h1 class="font-stellar-sans text-stellar-display font-semibold">
    Stellar foundation
  </h1>
  <p class="text-stellar-body" data-testid="action-count" aria-live="polite">
    Actions: {{ actionCount() }}
  </p>
  <stellar-button-atom label="Open workspace" (activated)="recordAction()" />
</main>
