model:
  default: Qwen3.5-9B-Q5_K_S
  provider: custom
  base_url: http://peon-meter:18436/v1
  context_length: 65536
agent:
  coding_context: focus
  max_turns: 250
  disabled_toolsets:
    - browser
    - clarify
    - code_execution
    - connections
    - delegation
    - memory
    - session_search
    - todo
    - vision
    - web
hooks_auto_accept: true
hooks:
  pre_tool_call:
    - command: python3 /usr/local/libexec/record-peon-tool-event.py pre_tool_call
      timeout: 3
      fail_closed: true
  post_tool_call:
    - command: python3 /usr/local/libexec/record-peon-tool-event.py post_tool_call
      timeout: 3
