model:
  # Proposed route only; no credential is installed and inference is not authorized.
  default: __SET_APPROVED_MODEL__
  provider: openai-codex
agent:
  reasoning_effort: high
  max_turns: 80
  disabled_toolsets:
    - browser-use
    - browser
    - clarify
    - code_execution
    - connections
    - delegation
    - file
    - image_gen
    - cronjob
    - computer_use
    - memory
    - session_search
    - terminal
    - todo
    - tts
    - vision
    - web
memory:
  memory_enabled: true
  write_approval: true
local_runtime:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
    send: false
