model:
  # Local route only; inference still requires separate authorization.
  default: Qwen3-14B-Q4_K_M
  provider: custom
  base_url: http://127.0.0.1:18438/v1
  context_length: 8192
agent:
  reasoning_effort: high
  max_turns: 80
  disabled_toolsets:
    - browser-use
    - browser
    - clarify
    - code_execution
    - connections
    - delegation
    - file
    - image_gen
    - cronjob
    - computer_use
    - memory
    - session_search
    - terminal
    - todo
    - tts
    - vision
    - web
memory:
  memory_enabled: true
  write_approval: true
local_runtime:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
    send: false
